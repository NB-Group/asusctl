<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2080;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#6437FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FF1929;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  <!-- Laptop base (bottom) -->
  <path d="M10 115 Q10 125 20 128 L180 128 Q190 125 190 115 L185 110 L15 110 Z" fill="#333" stroke="#444" stroke-width="1"/>
  <!-- Laptop lid / screen -->
  <rect x="22" y="12" width="156" height="98" rx="4" ry="4" fill="url(#bg)" stroke="#444" stroke-width="1.5"/>
  <!-- Screen area -->
  <rect x="30" y="20" width="140" height="82" rx="2" ry="2" fill="url(#screen)"/>
  <!-- Diagonal slash lines (ROG style) -->
  <line x1="40" y1="90" x2="70" y2="30" stroke="#FF1929" stroke-width="1.5" opacity="0.4"/>
  <line x1="55" y1="90" x2="85" y2="30" stroke="#FF1929" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="90" x2="100" y2="30" stroke="#FF1929" stroke-width="1.5" opacity="0.25"/>
  <line x1="130" y1="90" x2="160" y2="30" stroke="#6437FF" stroke-width="1.5" opacity="0.35"/>
  <line x1="145" y1="90" x2="175" y2="30" stroke="#6437FF" stroke-width="1.5" opacity="0.25"/>
  <!-- Keyboard hint -->
  <rect x="35" y="95" width="130" height="10" rx="1" fill="#2a2a2a" opacity="0.6"/>
  <!-- Trackpad -->
  <rect x="80" y="114" width="40" height="8" rx="1" fill="#3a3a3a"/>
</svg>
